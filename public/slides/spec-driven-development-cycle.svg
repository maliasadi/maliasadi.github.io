<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
  <title id="title">The spec-driven development cycle</title>
  <desc id="desc">Five phases in a loop. Verify returns to the spec. OpenSpec propose, apply, and archive are annotated only where the docs support the mapping.</desc>
  <rect width="1100" height="640" fill="#f6f6f7"/>

  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.4 8.6 5 1 8.6Z" fill="#0f766e"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.4 8.6 5 1 8.6Z" fill="#0369a1"/>
    </marker>
  </defs>


<text x="40" y="42" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="650">The spec-driven cycle</text>
<text x="40" y="70" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Verify checks the work, then the spec is revised and the loop runs again.</text>

<g>
<rect x="48" y="92" width="300" height="124" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="48" y="92" width="300" height="5" rx="2" fill="#0f766e"/>
<text x="64" y="122" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">01</text>
<text x="64" y="148" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Spec</text>
<text x="64" y="172" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">What and why, with requirements</text>
<text x="64" y="190" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">and scenarios.</text>
</g>
<g>
<rect x="400" y="92" width="300" height="124" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="400" y="92" width="300" height="5" rx="2" fill="#0f766e"/>
<text x="416" y="122" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">02</text>
<text x="416" y="148" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Plan</text>
<text x="416" y="172" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">The technical approach, and</text>
<text x="416" y="190" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">the constraints it must respect.</text>
</g>
<g>
<rect x="752" y="92" width="300" height="124" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="752" y="92" width="300" height="5" rx="2" fill="#0f766e"/>
<text x="768" y="122" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">03</text>
<text x="768" y="148" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Tasks</text>
<text x="768" y="172" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Small pieces you can implement</text>
<text x="768" y="190" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">and check off one at a time.</text>
</g>

<line x1="348" y1="154" x2="392" y2="154" stroke="#0f766e" stroke-width="2.4" marker-end="url(#fwd)"/>
<line x1="700" y1="154" x2="744" y2="154" stroke="#0f766e" stroke-width="2.4" marker-end="url(#fwd)"/>
<line x1="902" y1="216" x2="902" y2="268" stroke="#0f766e" stroke-width="2.4" marker-end="url(#fwd)"/>

<g>
<rect x="752" y="276" width="300" height="124" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="752" y="276" width="300" height="5" rx="2" fill="#0f766e"/>
<text x="768" y="306" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">04</text>
<text x="768" y="332" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Implement</text>
<text x="768" y="356" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Build from the tasks,</text>
<text x="768" y="374" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">one slice at a time.</text>
</g>
<g>
<rect x="48" y="276" width="300" height="124" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="48" y="276" width="300" height="5" rx="2" fill="#0f766e"/>
<text x="64" y="306" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">05</text>
<text x="64" y="332" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Verify</text>
<text x="64" y="356" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Check the result against</text>
<text x="64" y="374" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">the spec, then refine it.</text>
</g>

<line x1="752" y1="338" x2="356" y2="338" stroke="#0f766e" stroke-width="2.4" marker-end="url(#fwd)"/>
<path d="M198 276 V250 H22 V154 H42" fill="none" stroke="#0369a1" stroke-width="2.4" marker-end="url(#back)"/>
<text x="48" y="240" fill="#0369a1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="650">Refine the spec</text>

<rect x="40" y="424" width="1020" height="168" rx="16" fill="#ffffff" stroke="#e4e4e7"/>
<text x="64" y="456" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">WHERE OPENSPEC FITS</text>
<text x="64" y="490" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">propose drafts Spec, Plan, and Tasks together: proposal, delta specs, a design when needed, and tasks.</text>
<text x="64" y="518" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">apply is Implement. It works through tasks.md and checks the boxes.</text>
<text x="64" y="546" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">verify is an expanded command, not part of the default core profile. It checks the code against the artifacts.</text>
<text x="64" y="574" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">archive is not Verify. After you accept the change, it merges the delta into openspec/specs.</text>

</svg>
