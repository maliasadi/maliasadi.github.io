<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="384" viewBox="0 0 920 384" role="img" aria-labelledby="title desc">
  <title id="title">Spec-driven development</title>
  <desc id="desc">Spec, plan, tasks, implement, and verify, with verify returning to the spec. OpenSpec's propose, apply, and archive are annotated.</desc>
  <rect width="920" height="384" fill="#f6f6f7"/>

  <defs>
    <marker id="fwd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.4 8.6 5 1 8.6Z" fill="#0f766e"/>
    </marker>
    <marker id="back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1.4 8.6 5 1 8.6Z" fill="#0369a1"/>
    </marker>
  </defs>


<text x="28" y="32" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Spec-driven development</text>
<g>
<rect x="24" y="48" width="250" height="100" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="24" y="48" width="250" height="5" rx="2" fill="#0f766e"/>
<text x="40" y="78" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">01</text>
<text x="40" y="104" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Spec</text>
<text x="40" y="128" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">What and why, with</text>
<text x="40" y="146" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">requirements and scenarios.</text>
</g>
<g>
<rect x="334" y="48" width="250" height="100" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="334" y="48" width="250" height="5" rx="2" fill="#0f766e"/>
<text x="350" y="78" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">02</text>
<text x="350" y="104" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Plan</text>
<text x="350" y="128" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Technical approach</text>
<text x="350" y="146" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">and the constraints.</text>
</g>
<g>
<rect x="644" y="48" width="250" height="100" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="644" y="48" width="250" height="5" rx="2" fill="#0f766e"/>
<text x="660" y="78" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">03</text>
<text x="660" y="104" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Tasks</text>
<text x="660" y="128" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Small pieces you can</text>
<text x="660" y="146" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">implement and check.</text>
</g>
<line x1="274" y1="98" x2="326" y2="98" stroke="#0f766e" stroke-width="2.2" marker-end="url(#fwd)"/>
<line x1="584" y1="98" x2="636" y2="98" stroke="#0f766e" stroke-width="2.2" marker-end="url(#fwd)"/>
<line x1="769" y1="148" x2="769" y2="176" stroke="#0f766e" stroke-width="2.2" marker-end="url(#fwd)"/>
<g>
<rect x="644" y="184" width="250" height="100" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="644" y="184" width="250" height="5" rx="2" fill="#0f766e"/>
<text x="660" y="214" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">04</text>
<text x="660" y="240" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Implement</text>
<text x="660" y="264" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Build from the tasks,</text>
<text x="660" y="282" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">one slice at a time.</text>
</g>
<g>
<rect x="24" y="184" width="250" height="100" rx="14" fill="#ffffff" stroke="#e4e4e7"/>
<rect x="24" y="184" width="250" height="5" rx="2" fill="#0f766e"/>
<text x="40" y="214" fill="#0f766e" font-family="ui-monospace, monospace" font-size="13" letter-spacing="1.4">05</text>
<text x="40" y="240" fill="#101114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="650">Verify</text>
<text x="40" y="264" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Check the result</text>
<text x="40" y="282" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">against the spec.</text>
</g>
<line x1="644" y1="234" x2="282" y2="234" stroke="#0f766e" stroke-width="2.2" marker-end="url(#fwd)"/>
<path d="M149 184 V164 H16 V98 H46" fill="none" stroke="#0369a1" stroke-width="2.2" marker-end="url(#back)"/>
<text x="168" y="176" fill="#0369a1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="650">Refine the spec</text>
<text x="24" y="318" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">OpenSpec: propose drafts Spec, Plan, and Tasks together. apply is Implement.</text>
<text x="24" y="340" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">archive is not Verify. It merges an accepted delta into the main specs.</text>
<text x="24" y="362" fill="#52525b" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">The verify command is on the expanded profile, not the default core profile.</text>

</svg>
